name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Run authenticated integration check
        env:
          API_TOKEN: ${{ secrets.INTERNAL_DEPLOY_KEY }}
        run: |
          if [ -z "$API_TOKEN" ]; then
             echo "FATAL: Secret INTERNAL_DEPLOY_KEY is not set or empty"
             exit 1
          fi

 
